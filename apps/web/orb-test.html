<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orb Test</title>
<style>
  body {
    background: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  #orb {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: linear-gradient(135deg, #b388ff, #6a4fff 40%, #3a2fb0 70%, #1a0f6a 100%);
    box-shadow: 0 0 60px 15px rgba(140, 80, 255, 0.6), 0 0 120px 40px rgba(90, 60, 220, 0.35);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 60px 15px rgba(140, 80, 255, 0.6), 0 0 120px 40px rgba(90, 60, 220, 0.35); }
    50% { transform: scale(1.05); box-shadow: 0 0 80px 25px rgba(160, 100, 255, 0.8), 0 0 150px 50px rgba(100, 70, 230, 0.5); }
    100% { transform: scale(1); box-shadow: 0 0 60px 15px rgba(140, 80, 255, 0.6), 0 0 120px 40px rgba(90, 60, 220, 0.35); }
  }

  #label {
    margin-top: 40px;
    font-family: sans-serif;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 5px;
    color: #9a7fff;
    text-shadow:
      0 1px 0 #4a2fb0,
      0 2px 0 #3a237f,
      0 3px 0 #2a1a5f,
      0 4px 6px rgba(0,0,0,0.6),
      0 0 20px rgba(140, 100, 255, 0.6);
  }
</style>
</head>
<body>

<div id="orb"></div>
<div id="label">JARTRON</div>

</body>
</html>
